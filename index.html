details:{
overview:"After Harsha’s death, India saw a Tripartite Struggle among three dynasties for supremacy in northern India.\nGurjara-Pratiharas (c. 730–1036 CE): Also called Imperial Pratiharas, they initially ruled Gujarat and later won Kannauj (816 CE). Key rulers were Nagabhata I (defeated Arab invaders), Mihira Bhoja and Mahendrapala I. At their height (9th c.), their territory rivalled the Gupta Empire, spanning from Sindh to Bengal. They patronized Shaivism and temple-building (open-pillared temples). The Pratihara style is noted for Khajuraho-group temples (UNESCO site). The dynasty’s power waned by 10th c. due to internal strife and Ghaznavid raids\nPala Empire (c. 750–1174 CE): A Buddhist dynasty of Bengal, founded by elected ruler Gopala. Its greatest rulers were Dharmapala and Devapala, who expanded from Bengal into Bihar and Odisha. The Palas are famed for building grand Buddhist monasteries – Somapura Mahavihara, Odantapuri – and for patronizing the great universities Nalanda and Vikramashila. Pala art (stone sculpture) flourished in a distinctive style. The Pala Empire brought stability and prosperity to Bengal (called a golden era). Palas maintained diplomatic relations with Tibet, Srivijaya, and Abbasids, introducing Islam to Bengal via trade. Their decline began under Sena chieftains, leading to the end of Buddhist imperial patronage\nRashtrakuta Empire (c. 753–982 CE): A powerful Deccan (Karnataka) dynasty that challenged the Pratiharas and Palas. Founded by Dantidurga, it reached its zenith under Amoghavarsha I (r. 814–878), a noted scholar and patron of Kannada literature. The Rashtrakutas built the great Kailasa temple at Ellora (cave 16) by carving a monolithic rock in Dravidian style. They also supported Sanskrit scholars and Jainism (the Jain Narayana temples at Pattadakal). Militarily, they even sacked Kannauj in 982, marking the decline of the Pratihara power.\n\nThese three empires engaged in mutual warfare for Kannauj (the Tripartite Struggle)
